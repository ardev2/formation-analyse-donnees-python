[project]
name = "rapport-ventes"
version = "0.1.0"
description = "Rapport mensuel des ventes par région : indicateurs, graphiques et alertes sur les objectifs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.scripts]
rapport-ventes = "rapport_ventes.cli:main"

[tool.ruff]
line-length = 120

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4",
    "pytest>=8",
    "ruff>=0.6",
]
